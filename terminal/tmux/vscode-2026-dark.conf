# VS Code Dark 2026 -- generated by tools/gen_terminal.py
# source-file this from ~/.tmux.conf
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

set -g status-style "bg=#191A1B,fg=#8C8C8C"
set -g status-left-style "bg=#191A1B,fg=#BBBEBF"
set -g status-right-style "bg=#191A1B,fg=#8C8C8C"
set -g window-status-current-style "bg=#121314,fg=#BFBFBF,bold"
set -g window-status-style "bg=#191A1B,fg=#8C8C8C"
set -g pane-border-style "fg=#2A2B2C"
set -g pane-active-border-style "fg=#2D6E8A"
set -g message-style "bg=#202122,fg=#BBBEBF"
set -g mode-style "bg=#245C73,fg=#BBBEBF"
